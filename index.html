<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Advanced Webpage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">My Advanced Webpage</h1>

    <nav class="site-nav">
      <ul>
        <li><a href="#about" class="active">About</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About This Page</h2>
      <p>This section explains...</p>
    </section>

    <figure>
      <img src="image1.jpg" alt="HTML and CSS example">
      <figcaption>Clean semantic code improves readability.</figcaption>
    </figure>

    <section id="gallery">
      <h2>Image Gallery</h2>
      <p>Preview of design samples...</p>
    </section>

    <section id="contact">
      <h2>Contact Form</h2>
      <form method="post">
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>©2025 Web Technologies Essentials</p>
  </footer>

</body>
</html>
